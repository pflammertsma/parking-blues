# Cloud Build config for continuous deployment: a push to `main` on GitHub
# runs this via the Cloud Build trigger set up in the parking-blues-mvp
# project, which redeploys the Cloud Run service (see README section 10 for
# the equivalent one-shot manual deploy this mirrors). Region is
# europe-west1, not europe-west6 (Zurich) -- see README section 11: Cloud
# Run domain mappings, needed for the API subdomain, aren't available in
# europe-west6.
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - parking-blues
      - --source=.
      - --region=europe-west1
      - --allow-unauthenticated
      - --max-instances=1
options:
  logging: CLOUD_LOGGING_ONLY
