# Build performance: the machine has plenty of RAM, so don't starve the daemons.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# The version of both apps, "major.minor.patch" with each part 0..99. This is the only number to touch:
# bump it for every Play upload (a version can never be uploaded twice or go down). The version codes are
# computed from it in build.gradle.kts: formFactor * 1,000,000 + major * 10,000 + minor * 100 + patch, with
# phone/Android Auto = 1 and Automotive OS = 2 (reserve 3, 4, ... for any future form factor).
# 0.1.6 is codes 1000106 / 2000106; 0.2.0 is 1000200 / 2000200; 1.0.0 is 1010000 / 2010000.
parkingblues.version=0.1.6

# Google sign-in: the OAuth *web application* client id from Google Cloud
# Console (not a secret). Leave empty to hide the sign-in menu entry. Setup:
# deploy/auth-setup.md
parkingblues.googleWebClientId=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
