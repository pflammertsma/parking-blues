# Build performance: the machine has plenty of RAM, so don't starve the daemons.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Bump `parkingblues.release` for every Play upload. Play needs a unique versionCode per artifact, so each
# form factor gets its own block of a million codes: phone/Android Auto = 1,000,000 + release,
# Automotive OS = 2,000,000 + release (reserve 3, 4, ... for any future form factor).
parkingblues.release=2
parkingblues.versionName=0.1

# Google sign-in: the OAuth *web application* client id from Google Cloud
# Console (not a secret). Leave empty to hide the sign-in menu entry. Setup:
# deploy/auth-setup.md
parkingblues.googleWebClientId=
