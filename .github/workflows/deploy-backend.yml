name: Deploy backend to Cloud Run

# Whenever backend code changes on main, redeploy the parking-blues Cloud
# Run service directly via `gcloud run deploy --source .` -- no Cloud Build
# trigger involved (one was never actually set up despite an old
# cloudbuild.yaml comment claiming otherwise; see README section 10).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "main.py"
      - "requirements.txt"
      - "Procfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Sign-in stays off until the repository variable GOOGLE_WEB_CLIENT_ID is
      # set (Settings > Secrets and variables > Actions > Variables); see
      # deploy/auth-setup.md. Without it the API is exactly as before.
      # ^@^ makes '@' the separator so OWNER_SUBS may itself contain commas.
      - name: Deploy to Cloud Run
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          OWNER_SUBS: ${{ vars.OWNER_SUBS }}
        run: |
          SIGN_IN_FLAGS=()
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            SIGN_IN_FLAGS+=(
              --update-env-vars "^@^GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}@AUTH_STORE=firestore@GOOGLE_CLOUD_PROJECT=parking-blues-mvp@OWNER_SUBS=${OWNER_SUBS}"
              --update-secrets "AUTH_JWT_SECRET=parking-blues-jwt-secret:latest"
            )
          fi
          gcloud run deploy parking-blues \
            --project parking-blues-mvp \
            --source . \
            --region europe-west1 \
            --allow-unauthenticated \
            --max-instances=1 \
            "${SIGN_IN_FLAGS[@]}"
