name: Deploy backend to Cloud Run

# Whenever backend code changes on main, redeploy the parking-blues Cloud
# Run service directly via `gcloud run deploy --source .` -- no Cloud Build
# trigger involved (one was never actually set up despite an old
# cloudbuild.yaml comment claiming otherwise; see README section 10).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "main.py"
      - "requirements.txt"
      - "Procfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy parking-blues \
            --project parking-blues-mvp \
            --source . \
            --region europe-west1 \
            --allow-unauthenticated \
            --max-instances=1
