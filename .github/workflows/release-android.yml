name: Release Android to Play Console

# Never runs on an ordinary push. Builds both release bundles (phone + Android
# Auto, and Android Automotive OS -- see android/README.md's Release Builds
# section) and uploads each to its own Play Console track. Needs a one-time
# setup of the signing and Play API secrets below; see
# deploy/play-publish-setup.md, which also has the publication rules.
#
# Two ways to start it:
#  * Push a tag `release-<N>`, where N is `parkingblues.release` in
#    android/gradle.properties. That ALWAYS goes to the internal tracks, as
#    "completed". A tag can never reach production.
#  * Run it by hand (Actions -> Run workflow) to pick other tracks, e.g. to
#    promote to production as a "draft".
#
# Before either: bump `parkingblues.release` (and `parkingblues.versionName`
# if this is a user-visible version bump) in android/gradle.properties, commit
# and push that first. This workflow builds what is on the commit it runs
# against -- it does not bump the version itself, so the bump stays a
# deliberate, reviewable commit rather than something CI does silently.
on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      app_track:
        description: "Play Console track for the phone / Android Auto bundle (:app)"
        type: string
        default: "internal"
      automotive_track:
        description: >-
          Play Console track for the Android Automotive OS bundle (:automotive).
          Google's form-factor track prefix is "automotive" (e.g.
          automotive:internal) -- check your Play Console listing's Testing/
          Production pages for the exact name it actually expects before the
          first real run; see deploy/play-publish-setup.md.
        type: string
        default: "automotive:internal"
      release_status:
        description: >-
          "completed" goes live on the chosen track immediately (normal for
          internal/alpha/beta, where testers already opted in). "draft"
          uploads without releasing, so a human has to start the rollout from
          Play Console -- the safer choice for a production track.
        type: choice
        options: ["completed", "draft"]
        default: "completed"

# Two releases at once could race on version codes and tracks.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the "is this commit on main" check below needs history

      # Rules for tag-started releases (see deploy/play-publish-setup.md):
      # the commit must be on main, and the tag number must be the release number
      # in the repo, so a stale or mistyped tag cannot upload the wrong build.
      - name: Check the release tag
        if: github.ref_type == 'tag'
        working-directory: .
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main; release only from main"; exit 1; }
          n=$(grep '^parkingblues.release=' android/gradle.properties | cut -d= -f2 | tr -d '\r')
          [ "$GITHUB_REF_NAME" = "release-$n" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match parkingblues.release=$n in android/gradle.properties"; exit 1; }

      - name: Check the branch of a manual run
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "::error::Run this workflow from main (it was started from ${{ github.ref_name }})"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # keystore/keystore.properties and keystore/parking-blues-release.jks are
      # git-ignored (see android/README.md's Release Builds section) -- CI
      # recreates them from secrets instead. The parkingblues.release-signing
      # convention plugin (build-logic/) reads exactly this file; without it,
      # release builds are left unsigned rather than failing, so a missing
      # secret here would fail at the Play upload step, not silently ship an
      # unsigned bundle.
      - name: Write the release keystore
        run: |
          test -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" || { echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p keystore
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/parking-blues-release.jks
          cat > keystore/keystore.properties <<EOF
          storeFile=parking-blues-release.jks
          storePassword=${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EOF

      # google-services.json is gitignored (it names our Firebase project), so CI writes it
      # from a secret into both app modules. Without it the Firebase plugins are skipped and
      # the bundle would ship with no crash reporting, so a missing secret stops the run.
      - name: Write the Firebase config (crash reporting)
        run: |
          test -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set"; exit 1; }
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          cp app/google-services.json automotive/google-services.json

      # The web client id for Google sign-in is baked into the app at build time (locally it
      # comes from ~/.gradle/gradle.properties). Without it the sign-in menu entry is hidden.
      - name: Check the sign-in client id
        run: test -n "${{ vars.GOOGLE_WEB_CLIENT_ID }}" || { echo "::error::The GOOGLE_WEB_CLIENT_ID repository variable is not set"; exit 1; }

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release bundles
        run: >-
          ./gradlew :app:bundleRelease :automotive:bundleRelease
          -Pparkingblues.googleWebClientId="${{ vars.GOOGLE_WEB_CLIENT_ID }}"

      - name: Upload phone / Android Auto bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.lammertsma.parkingblues
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.app_track || 'internal' }}
          status: ${{ inputs.release_status || 'completed' }}

      - name: Upload Android Automotive OS bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.lammertsma.parkingblues
          releaseFiles: android/automotive/build/outputs/bundle/release/automotive-release.aab
          track: ${{ inputs.automotive_track || 'automotive:internal' }}
          status: ${{ inputs.release_status || 'completed' }}
